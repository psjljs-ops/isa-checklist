var STORES = {
  albarich: { label:"", lead:true },
  tenping:  { label:"", lead:true },
  ajungdang:{ label:"", lead:true },
  coupang:  { label:"쿠팡", btn:"쿠팡에서 보기" }
};
var DISCLOSURE = {
  ajungdang: "이 콘텐츠는 아정당 파트너스 활동의 일환으로, 링크를 통해 구매가 발생할 경우 파트너와 구매 고객 모두에게 일정 리워드가 제공됩니다.",
  lead:    "이 페이지의 견적·상담 신청 링크는 제휴 광고 링크이며, 신청 후 상담이 이루어지면 운영자가 수수료를 받을 수 있습니다. 신청과 상담은 무료입니다.",
  coupang: "이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."
};

/* ---------------- 그리기 ---------------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var WD = ["일","월","화","수","목","금","토"];
var params = new URLSearchParams(location.search);
var key = params.get("c"), date = params.get("d");
if (!(date && /^\d{4}-\d{2}-\d{2}$/.test(date))) date = null;
var cat = CATEGORIES[key];
var qs = date ? "&d=" + date : "";
if (date) document.getElementById("backLink").href = "index.html?d=" + date;

var VKEY = "offers-visited";
var visited = {};
try { visited = JSON.parse(localStorage.getItem(VKEY)) || {}; } catch (e) {}

var infoIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';

function moreLinks() {
  var h = "";
  Object.keys(CATEGORIES).forEach(function (k) {
    if (k === key) return;
    var c = CATEGORIES[k];
    h += '<a href="offers.html?c=' + k + qs + '"><span>' + c.icon + '</span>' + esc(c.menu) + '</a>';
  });
  return '<section class="card"><h2>다른 이사 준비도 확인해 보세요</h2><div class="more">' + h + '</div></section>';
}

function leadCard(it) {
  var v = visited[it.name];
  var logo = it.img ? '<img src="' + esc(it.img) + '" alt="">' : esc(it.name.charAt(0));
  return '<section class="card company">' +
    '<div class="company-head"><div class="logo" style="background:' + esc(it.color || "#3182f6") + '">' + logo + '</div>' +
    '<div><div class="name">' + esc(it.name) + '</div><div class="desc">' + esc(it.desc) + '</div></div></div>' +
    (it.tags && it.tags.length ? '<div class="tags">' + it.tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join("") + '</div>' : "") +
    '<a class="cta' + (v ? ' visited' : '') + '" href="' + esc(it.url || "#") + '" target="_blank" rel="sponsored nofollow noopener" data-name="' + esc(it.name) + '">' +
    (v ? '신청 페이지 다시 열기' : '무료 견적 신청하기') + '</a></section>';
}

function productCard(it) {
  var st = STORES[it.store] || {};
  var thumb = it.img ? '<img src="' + esc(it.img) + '" alt="" loading="lazy">' : '<span aria-hidden="true">' + (it.emoji || "🛒") + '</span>';
  return '<a class="product" href="' + esc(it.url || "#") + '" target="_blank" rel="sponsored nofollow noopener" data-name="' + esc(it.name) + '">' +
    '<div class="thumb">' + thumb + '</div><div class="pbody">' +
    '<div class="pname">' + esc(it.name) + '</div>' + (it.desc ? '<div class="pdesc">' + esc(it.desc) + '</div>' : "") +
    '</div><span class="pbtn">' + esc(st.btn || "보러 가기") + '</span></a>';
}

function renderIndex() {
  document.title = "이사 준비 추천 모음";
  document.getElementById("disclosure").textContent = DISCLOSURE.ajungdang + " " + DISCLOSURE.lead + " " + DISCLOSURE.coupang;
  var h = '<header class="hero"><span class="eyebrow">이사 준비 모음</span><h1>이사에 필요한 것,<br><em>한곳에서 비교</em></h1>' +
    '<p class="lead">견적 신청부터 준비물까지 필요한 항목을 골라 보세요.</p></header>';
  key = null;
  h += moreLinks().replace("다른 이사 준비도 확인해 보세요", "무엇이 필요하세요?");
  document.getElementById("page").innerHTML = h;
}

function renderCategory() {
  var items = cat.items.filter(function (it) { return it.url || SHOW_EMPTY_LINKS; });
  var leads = items.filter(function (it) { return (STORES[it.store] || {}).lead; });
  var shops = items.filter(function (it) { return !(STORES[it.store] || {}).lead; });
  if (cat.max) leads = leads.slice(0, cat.max);

  /* 이 페이지에 실제로 나오는 제휴 종류에 맞춰 대가성 문구 구성 */
  var d = [];
  if (leads.some(function (it) { return it.store === "ajungdang"; })) d.push(DISCLOSURE.ajungdang);
  if (leads.some(function (it) { return it.store !== "ajungdang"; })) d.push(DISCLOSURE.lead);
  if (shops.some(function (it) { return it.store === "coupang"; })) d.push(DISCLOSURE.coupang);
  document.getElementById("disclosure").textContent = d.join(" ");

  var badge = cat.badge;
  if (date && leads.length) {
    var a = date.split("-"), dt = new Date(+a[0], +a[1]-1, +a[2]);
    badge = (dt.getMonth()+1) + "월 " + dt.getDate() + "일 (" + WD[dt.getDay()] + ") 이사 · " + cat.badge;
  }
  document.title = cat.menu + " | 이사 준비";

  var h = '<header class="hero"><span class="eyebrow">' + esc(badge) + '</span><h1>' + cat.title + '</h1><p class="lead">' + esc(cat.lead) + '</p></header>';
  if (cat.tip) h += '<div class="tip">' + infoIcon + '<div>' + esc(cat.tip) + '</div></div>';
  h += leads.map(leadCard).join("");
  if (shops.length) h += '<div class="grid">' + shops.map(productCard).join("") + '</div>';
  if (!leads.length && !shops.length) h += '<div class="card empty">지금은 준비 중이에요.</div>';
  if (cat.points) {
    h += '<section class="card"><h2>꼭 확인하세요</h2><ol class="points">' +
      cat.points.map(function (p) { return '<li><div><b>' + esc(p[0]) + '</b><span>' + esc(p[1]) + '</span></div></li>'; }).join("") + '</ol></section>';
  }
  h += moreLinks();
  document.getElementById("page").innerHTML = h;
}

if (cat) renderCategory(); else renderIndex();

document.getElementById("page").addEventListener("click", function (e) {
  var a = e.target.closest("a.cta, a.product"); if (!a) return;
  if (a.getAttribute("href") === "#") { e.preventDefault(); alert("제휴 링크가 아직 설정되지 않았어요 (" + a.dataset.name + ")"); return; }
  if (a.classList.contains("cta")) {
    visited[a.dataset.name] = true;
    try { localStorage.setItem(VKEY, JSON.stringify(visited)); } catch (err) {}
    a.classList.add("visited"); a.textContent = "신청 페이지 다시 열기";
  }
});
